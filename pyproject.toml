[project]
name = "dragoman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Khoi Pham Minh", email = "khoipm06@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
dragoman = "dragoman:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]
